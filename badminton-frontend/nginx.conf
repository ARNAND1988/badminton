map $http_x_forwarded_proto $upstream_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://badminton-backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Preserve Cloudflare's original HTTPS scheme. Using $scheme here always
    # reported HTTP because Cloudflare connects to this container internally,
    # causing Flask-Talisman to redirect POST requests and lose their bodies.
    proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
  }

  location = /docs {
    proxy_pass http://badminton-backend:8000/api/docs;
    proxy_set_header Host $host;
  }

  location = /swagger {
    proxy_pass http://badminton-backend:8000/api/docs;
    proxy_set_header Host $host;
  }

  location = /swagger/ {
    proxy_pass http://badminton-backend:8000/api/docs;
    proxy_set_header Host $host;
  }

  location = /openapi.json {
    proxy_pass http://badminton-backend:8000/api/openapi.json;
    proxy_set_header Host $host;
  }

  location = /swagger.json {
    proxy_pass http://badminton-backend:8000/api/swagger.json;
    proxy_set_header Host $host;
  }
}
